<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Ký Tài Khoản - AI Clinic</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style-login.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-md w-full p-8 shadow-2xl">
        <div class="text-center mb-8">
            <div class="w-14 h-14 bg-teal-600 text-white rounded-2xl flex items-center justify-center text-2xl mx-auto mb-3 shadow-lg shadow-teal-500/30"><i class="fa-solid fa-user-plus"></i></div>
            <h2 class="text-2xl font-bold text-slate-900">Đăng Ký Tài Khoản</h2>
            <p class="text-xs text-slate-500 mt-1">Trải nghiệm chăm sóc sức khỏe thông minh</p>
        </div>
        <form action="login.html" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Họ và tên</label>
                <input type="text" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500 text-sm" placeholder="Nhập họ tên đầy đủ...">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Email / Số điện thoại</label>
                <input type="text" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500 text-sm" placeholder="Nhập email hoặc SĐT...">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-700 uppercase mb-1">Mật khẩu</label>
                <input type="password" required class="w-full bg-slate-50 border border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-teal-500 text-sm" placeholder="••••••••">
            </div>
            <button type="submit" class="w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-teal-500/30 transition text-sm">Tạo Tài Khoản</button>
        </form>
        <p class="text-center text-xs text-slate-500 mt-6">Đã có tài khoản? <a href="login.html" class="text-teal-600 font-semibold hover:underline">Đăng nhập</a></p>
    </div>
</body>
</html>
